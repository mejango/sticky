name: web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@12.0.1 --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run ts:check
      # Local hash comparison only: a browser query whose document is missing from the
      # persisted registry is rejected by the proxy, so drift here silently breaks a
      # feature. The live-schema half of the script stays out of CI so a third-party
      # outage cannot fail the build.
      - name: Check persisted Bendystraw operation registry
        run: npm run schema:check:offline
      - name: Check reviewed transaction inventory
        run: npm run transaction:check
      - name: Run tests
        run: npm run test:ci
      - name: Build production application
        run: npm run build
