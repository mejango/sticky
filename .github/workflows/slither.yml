name: slither
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/Sticky
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: extensions/Sticky
          submodules: recursive
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Bananapus/nana-core-v6
          ref: feff600654aee6fb1747dded692f18068b2230a6
          path: nana-core-v6
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Bananapus/nana-distributor-v6
          ref: 44d6d5d2e7cca77422ee0ac4909cf42ccf7839b5
          path: nana-distributor-v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: extensions/Sticky/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked Solidity dependencies
        run: npm ci --omit=dev
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
      - name: Install Slither
        run: python -m pip install slither-analyzer==0.11.3
      - name: Analyze production contracts
        run: slither . --config-file slither-ci.config.json --fail-medium
